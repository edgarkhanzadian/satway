ls:
  .ts: regex:[a-z0-9\-\._]+
  .tsx: regex:[a-z0-9\-\[\]\._]+
  .js: regex:[a-z0-9\-\._]+
  .dir: regex:\.?[a-z0-9]+(-[a-z0-9]+)*

ignore:
  - .git
  - .idea
  - .vscode
  - .wrangler
  - .proofs
  - .claude
  - node_modules
  - dist
  - apps/*/node_modules
  - apps/*/dist
  - apps/web/satway-styles
  - apps/api/.wrangler
  - apps/e2e/.web-build
  - apps/e2e/test-results
  - apps/e2e/playwright-report
  - apps/e2e/blob-report
  - apps/e2e/.playwright
  - packages/*/node_modules
  - scripts/node_modules
