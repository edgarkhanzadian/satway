ls:
  .ts: regex:[a-z0-9\-\._]+
  .tsx: regex:[a-z0-9\-\[\]\._]+
  .js: regex:[a-z0-9\-\._]+
  .dir: regex:\.?[a-z0-9]+(-[a-z0-9]+)*

ignore:
  - .git
  - .idea
  - .vscode
  - .wrangler
  - .proofs
  - node_modules
  - dist
  - apps/*/node_modules
  - apps/*/dist
  - apps/web/portage-styles
  - apps/api/.wrangler
  - packages/*/node_modules
  - scripts/node_modules
