name: code-checks

on:
  push:
    branches:
      - '**'
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  code-checks:
    name: code-checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: install
        run: pnpm install --frozen-lockfile

      - name: lint-eslint
        run: pnpm lint

      - name: lint-prettier
        run: pnpm format:check

      - name: lint-syncpack
        run: pnpm syncpack:lint

      - name: lint-filenames
        run: pnpm lint:filenames

      - name: typecheck
        run: pnpm typecheck

      - name: lint-deps
        run: pnpm lint:deps

      - name: test
        run: pnpm test

      - name: build
        run: pnpm build

      - name: check-bundle
        run: pnpm check:bundle

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: install
        run: pnpm install --frozen-lockfile

      - name: playwright-version
        id: playwright
        run: echo "version=$(pnpm --filter @portage/e2e exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: cache-browsers
        id: browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: install-browsers
        if: steps.browsers.outputs.cache-hit != 'true'
        run: pnpm --filter @portage/e2e exec playwright install --with-deps chromium webkit

      - name: install-browser-system-deps
        if: steps.browsers.outputs.cache-hit == 'true'
        run: pnpm --filter @portage/e2e exec playwright install-deps chromium webkit

      - name: test-e2e
        run: pnpm test:e2e

      - name: upload-report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/e2e/playwright-report
            apps/e2e/test-results
          retention-days: 14
